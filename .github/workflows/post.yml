name: Instagram自動投稿
on:
  schedule:
    - cron: '0 10 * * *'   # 毎日 19:00 (日本時間) ※GitHubの都合で数分〜数十分遅れることがあります
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 にすると投稿せずに確認だけ'
        default: '0'
permissions:
  contents: write
concurrency: instagram-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 投稿
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_LOGIN: ${{ vars.IG_LOGIN || 'instagram' }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN || '1' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python scripts/post_reel.py
      - name: 投稿済みを記録
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add queue.csv
          git diff --cached --quiet || (git commit -m "投稿済みを更新" && git push)
