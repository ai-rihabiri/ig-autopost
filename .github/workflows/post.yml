name: Instagram自動投稿
on:
  schedule:
    # 20分ごとに起動し、予定時刻を過ぎた分だけ投稿する（GitHubの定時実行が抜けても取り戻せる）
    # 予定は1日8本：日本時間 7:13 / 9:07 / 11:41 / 13:22 / 15:56 / 17:34 / 19:18 / 21:47（毎日0〜14分ずつずらす）
    - cron: '4,24,44 22-23,0-13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 にすると投稿せずに確認だけ'
        default: '0'
permissions:
  contents: write
concurrency: instagram-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            queue.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 投稿
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_LOGIN: ${{ vars.IG_LOGIN || 'instagram' }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || format('https://raw.githubusercontent.com/{0}/main/videos/', github.repository) }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN || '1' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
          SLOTS: ${{ vars.IG_SLOTS || '07:13,09:07,11:41,13:22,15:56,17:34,19:18,21:47' }}
        run: python scripts/post_reel.py
      - name: 投稿済みを記録
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add queue.csv
          git diff --cached --quiet || (git commit -m "投稿済みを更新" && git pull --rebase && git push)
